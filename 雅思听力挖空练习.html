<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思听力挖空练习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
  :root{
    --bg0:#0b1120; --card:#151f33; --card2:#1e2a44; --card3:#273654;
    --line:#2c3a58; --line2:#3b4c73;
    --txt:#e6edf7; --dim:#8fa3bf; --faint:#5c7089;
    --acc:#38bdf8; --acc2:#818cf8; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(56,189,248,.08), transparent 60%),
      radial-gradient(1000px 500px at 90% 0%, rgba(129,140,248,.07), transparent 60%),
      var(--bg0);
    color:var(--txt);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh;
  }
  .wrap{max-width:1160px;margin:0 auto;padding:28px 18px 90px}
  h1{font-size:27px;letter-spacing:.5px;margin-bottom:6px;background:linear-gradient(90deg,#7dd3fc,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);font-size:13.5px;margin-bottom:22px;line-height:1.9}
  kbd{background:var(--card3);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font-size:12px;font-family:inherit}
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,.015), rgba(0,0,0,.08)), var(--card);
    border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);transition:border-color .2s;
  }
  .card:hover{border-color:#31415f}
  .card h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:#cfe1f5}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  input[type=text],textarea,select{
    background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);
    padding:10px 13px;font-size:14px;outline:none;transition:border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  textarea{width:100%;min-height:120px;resize:vertical;line-height:1.7;font-family:inherit}
  button{
    background:linear-gradient(180deg,#4cc3fa,#2f9fe8);color:#06121f;border:none;border-radius:10px;
    padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;
    box-shadow:0 2px 8px rgba(56,189,248,.25);
  }
  button:hover{filter:brightness(1.12);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.ghost{background:var(--card3);color:var(--txt);border:1px solid var(--line2);box-shadow:none;font-weight:600}
  button.small{padding:6px 11px;font-size:12px;border-radius:8px}
  button.big{padding:13px 26px;font-size:16px;border-radius:12px}
  button:disabled{opacity:.45;cursor:not-allowed;transform:none}
  button.on{border-color:var(--warn);color:var(--warn)}
  .hint{color:var(--dim);font-size:12.5px;line-height:1.8}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--card3);border:1px solid var(--line2);border-radius:99px;padding:3px 11px;font-size:12px;color:var(--dim)}
  .matlist{display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
  .matlist::-webkit-scrollbar{width:8px}
  .matlist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  #matSearch{width:250px}
  .cardtitle{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .cardtitle h2{margin-bottom:0}
  .mat{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 16px;
    cursor:pointer;transition:.18s;
  }
  .mat:hover{border-color:var(--acc);transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .mat .name{font-weight:700;font-size:15px}
  .mat .meta{color:var(--dim);font-size:12px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .mat .del{color:var(--faint);background:none;font-size:15px;padding:4px 9px;border:none;box-shadow:none}
  .mat .del:hover{color:var(--bad);transform:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
  .score{font-size:13px;color:var(--dim);display:flex;gap:10px}
  .score b{color:var(--acc);font-size:15px}
  .playbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #transBox{margin-top:12px;padding:14px 16px;border-radius:12px;background:rgba(129,140,248,.07);border:1px solid var(--line);color:#b9c8de;line-height:2;font-size:14.5px}
  #textBox{
    background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);
    padding:26px 24px;line-height:2.5;font-size:18px;max-height:58vh;overflow-y:auto;
    font-family:Georgia,"Times New Roman",serif;
    scrollbar-width:thin;scrollbar-color:var(--line2) transparent;
  }
  #textBox::-webkit-scrollbar{width:8px}
  #textBox::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
  #textBox.dictation .blank input{width:76px;font-size:14px;padding:2px 4px}
  #textBox.dictation .cn{font-size:13px;margin:2px 0 10px}
  .sent-chip{
    display:inline-block;margin-left:8px;padding:1px 9px;border-radius:99px;
    background:var(--card3);border:1px solid var(--line2);color:var(--dim);
    font-size:11px;font-family:-apple-system,"PingFang SC",sans-serif;font-variant-numeric:tabular-nums;
  }
  .cn{
    color:#9fb3d1;font-size:14.5px;line-height:1.85;margin:4px 0 12px;padding-left:10px;
    font-family:-apple-system,"PingFang SC",sans-serif;
    border-left:3px solid var(--line2);
  }
  .blank{display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
  .blank input{
    width:120px;background:rgba(6,15,30,.75);border:none;border-bottom:2px dashed var(--acc);
    border-radius:6px 6px 0 0;color:var(--txt);padding:3px 8px;font-size:16px;text-align:center;
    font-family:inherit;transition:.15s;
  }
  .blank input:focus{outline:none;border-bottom-style:solid;box-shadow:0 0 0 3px rgba(56,189,248,.1)}
  .blank.current input{border-bottom-color:var(--warn)}
  .blank.ok input{border-bottom:2px solid var(--ok);color:var(--ok)}
  .blank.bad input{border-bottom:2px solid var(--bad);color:var(--bad)}
  .blank .ans{color:var(--warn);font-size:15px;font-weight:700}
  .result{margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14.5px;display:none;line-height:1.8}
  .result.good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.45)}
  .result.meh{background:rgba(251,191,36,.09);border:1px solid rgba(251,191,36,.45)}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .hidden{display:none!important}
  input[type=file]{color:var(--dim);font-size:13px}
  .progress{background:var(--card2);border-radius:99px;height:8px;overflow:hidden}
  .empty-tip{text-align:center;color:var(--faint);padding:30px 0;font-size:14px}
  .subctl{display:inline-flex;align-items:center;gap:7px}
  .subctl .tag{font-size:11.5px;color:var(--faint);letter-spacing:.5px}
  .seekrow{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .seekrow .time{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
  #seekBar{
    flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:99px;outline:none;
    background:linear-gradient(90deg,var(--acc) 0%,var(--acc) 0%,var(--card3) 0%);
    cursor:pointer;
  }
  #seekBar::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.4);cursor:grab;
  }
  #seekBar::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.15)}
  #seekBar::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--acc);cursor:grab}
  #abBtn.ab-on{background:rgba(251,191,36,.15);border-color:var(--warn);color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <h1>🎧 雅思听力挖空练习</h1>
  <div class="sub">
    听音填空 → 即时批改 ｜
    <kbd>␣</kbd> 播放/暂停 · <kbd>←</kbd><kbd>→</kbd> ∓5s · <kbd>↑</kbd><kbd>↓</kbd> 挖空跳转 · <kbd>回车</kbd> 批改 · 进度自动保存
  </div>

  <div class="card">
    <h2>➕ 新建材料</h2>
    <div class="row" style="margin-bottom:10px">
      <input type="text" id="matName" placeholder="材料名称，如：剑桥18 Test1 Section1" style="flex:1;min-width:220px">
      <select id="blankMode">
        <option value="auto">重点词挖空（形容词/谓语动词，推荐）</option>
        <option value="manual">手动挖空 [方括号]</option>
        <option value="all-num">只挖数字/日期</option>
      </select>
    </div>
    <textarea id="transcript" placeholder="在此粘贴听力原文（英文），或点下方「语音识别自动出原文」。&#10;重点词模式：只挖形容词和谓语动词（含过去式/动名词），人名和数字不挖。&#10;保存后会同时生成「全篇听写」视图：每词一空，点「盲听」即可切换。&#10;手动模式：用方括号括住要挖的词，如：My postcode is [GU7 4BX]。"></textarea>
    <div class="row" style="margin-top:10px">
      <label style="color:var(--dim);font-size:13px">🔊 音频：</label>
      <input type="file" id="audioFile" accept="audio/*">
      <input type="text" id="audioUrl" placeholder="或粘贴音频链接 https://...mp3" style="flex:1;min-width:200px">
    </div>
    <div class="row" style="margin-top:10px">
      <button class="ghost" onclick="autoTranscribe(this)">🎙️ 语音识别自动出原文</button>
      <span class="subctl"><span class="tag">引擎</span>
        <select id="asrEngine" onchange="onEngineChange()">
          <option value="local" selected>Qwen3-ASR 本地服务器（默认，最准）</option>
          <option value="whisper">Whisper 浏览器内置（零安装，备用）</option>
        </select>
      </span>
      <span class="subctl" id="asrModelWrap" style="display:none"><span class="tag">模型</span>
        <select id="asrModel">
          <option value="Xenova/whisper-tiny.en">tiny（最快 ~40MB）</option>
          <option value="Xenova/whisper-base.en">base（~80MB）</option>
          <option value="Xenova/whisper-small.en">small（~250MB）</option>
          <option value="onnx-community/whisper-large-v3-turbo">Large-v3 Turbo（旗舰 ~800MB）</option>
        </select>
      </span>
      <span class="subctl" id="qwenWrap"><span class="tag">服务器</span>
        <input type="text" id="qwenServer" value="http://127.0.0.1:8399" placeholder="http://127.0.0.1:8399" style="min-width:230px">
      </span>
      <span class="subctl"><button onclick="saveMaterial()">💾 保存材料</button></span>
    </div>
    <div class="progress hidden" id="asrProgWrap" style="margin-top:10px">
      <div id="asrProg" style="height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s"></div>
    </div>
    <div id="asrStatus" class="hint" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="cardtitle">
      <h2>📚 我的材料</h2>
      <input type="text" id="matSearch" placeholder="🔍 搜索材料名称…" oninput="renderList()">
    </div>
    <div class="matlist" id="matList"></div>
  </div>
</div>

<div id="practice" class="hidden">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:10px">
      <button class="ghost small" onclick="goHome()">← 返回</button>
      <span id="pracName" style="font-weight:800;font-size:16px"></span>
    </div>
    <div class="score">
      <span class="chip">✅ 正确 <b id="correct">0</b></span>
      <span class="chip">❌ 错误 <b id="wrong" style="color:var(--bad)">0</b></span>
      <span class="chip">✍️ 已填 <b id="filled">0</b></span>
    </div>
  </div>

  <div class="card">
    <div class="seekrow">
      <span class="time" id="curTime">0:00</span>
      <input type="range" id="seekBar" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <span class="time" id="durTime">0:00</span>
    </div>
    <div class="playbar" id="audioBar">
      <button class="big" id="playBtn" onclick="togglePlay()">▶️ 播放</button>
      <button class="ghost" onclick="nudge(-5)">⏪ 5s</button>
      <button class="ghost" onclick="nudge(5)">5s ⏩</button>
      <button class="ghost" id="abBtn" onclick="cycleAB()">🔁 AB循环</button>
      <select id="rateSel" onchange="setRate(this.value)">
        <option value="1">1x 常速</option>
        <option value="0.8">0.8x</option>
        <option value="0.6">0.6x</option>
      </select>
      <span class="chip">␣ 播放/暂停 · ←→ ∓5s · ↑↓ 跳空</span>
    </div>
    <div id="ttsArea" class="playbar hidden">
      <button class="big" onclick="speakAll()">🔊 朗读全文</button>
      <button class="ghost small" onclick="speakAll(0.7)">🐢 慢速</button>
      <span class="hint" style="margin:0">本材料无音频，使用浏览器英语语音朗读。</span>
    </div>
  </div>

  <div id="textBox"></div>
  <div id="transBox" class="hidden"></div>

  <div class="result" id="result"></div>

  <div class="controls">
    <button class="big" onclick="checkAll()">✅ 批改</button>
    <button class="ghost" id="cnBtn" onclick="toggleSentTrans(this)">🇨🇳 逐句对照</button>
    <button class="ghost" id="blindBtn" onclick="toggleBlind()">🙈 盲听模式</button>
    <button class="ghost" onclick="revealAll()">显示答案</button>
    <button class="ghost" onclick="retryWrong()">🔁 只重做错题</button>
    <button class="ghost" onclick="resetAll()">清空重做</button>
  </div>
</div>

</div>

<audio id="player" style="display:none"></audio>

<script>
const LS_KEY = 'ielts_blank_materials_v4';
let materials = JSON.parse(localStorage.getItem(LS_KEY) || '[]');
let current = null;
let objURL = null;
let curMatIndex = -1;

/* ---------- IndexedDB ---------- */
function idbOpen(){
  return new Promise((res, rej)=>{
    const req = indexedDB.open('ielts_blank_db', 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore('audio');
    req.onsuccess = ()=> res(req.result);
    req.onerror = ()=> rej(new Error('无法打开本地数据库'));
  });
}
async function idbPut(key, blob){
  const db = await idbOpen();
  return new Promise((res, rej)=>{
    const tx = db.transaction('audio','readwrite');
    tx.objectStore('audio').put(blob, key);
    tx.oncomplete = ()=> res();
    tx.onerror = ()=> rej(new Error('音频写入本地数据库失败'));
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((res)=>{
    const rq = db.transaction('audio','readonly').objectStore('audio').get(key);
    rq.onsuccess = ()=> res(rq.result || null);
    rq.onerror = ()=> res(null);
  });
}
async function idbDel(key){
  const db = await idbOpen();
  return new Promise((res)=>{
    const tx = db.transaction('audio','readwrite');
    tx.objectStore('audio').delete(key);
    tx.oncomplete = ()=> res();
    tx.onerror = ()=> res();
  });
}

/* ---------- 全局错误显示 ---------- */
function showErr(msg){
  let b = document.getElementById('errBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'errBanner';
    b.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#7f1d1d;color:#fecaca;padding:10px 16px;font-size:13px;word-break:break-all;box-shadow:0 2px 8px rgba(0,0,0,.4)';
    document.body.appendChild(b);
  }
  b.textContent = '⚠️ ' + msg;
  clearTimeout(showErr._t);
  showErr._t = setTimeout(()=>{ b.remove(); }, 15000);
}
window.addEventListener('error', e => showErr(e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + e.lineno));
window.addEventListener('unhandledrejection', e => showErr('异步错误: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));

/* ---------- 首页 ---------- */
function renderList(){
  const el = document.getElementById('matList');
  const q = (document.getElementById('matSearch').value || '').trim().toLowerCase();
  if(!materials.length){ el.innerHTML = '<div class="empty-tip">还没有材料 —— 在上方粘贴原文或用语音识别创建第一个吧</div>'; return; }
  el.innerHTML = '';
  const list = materials.map((m,i)=>({m,i})).filter(x => !q || x.m.name.toLowerCase().includes(q));
  console.error('[filter] q=', JSON.stringify(q), '| materials:', materials.map(m=>m.name), '| list:', list.map(x=>x.m.name));
  if(!list.length){ el.innerHTML = '<div class="empty-tip">未找到匹配「' + esc(q) + '」的材料</div>'; return; }
  list.forEach(({m,i})=>{
    const d = document.createElement('div');
    d.className = 'mat';
    const done = m.blanks.filter(b=>b.state==='ok').length;
    const prog = m.blanks.length ? Math.round(done/m.blanks.length*100) : 0;
    const modeName = {auto:'重点词', dictation:'全篇听写', manual:'手动', 'all-num':'数字'}[m.mode] || '重点词';
    d.innerHTML = `<div>
        <div class="name">${esc(m.name)}</div>
        <div class="meta">
          <span class="chip">${modeName}</span>
          <span class="chip">${m.blanks.length} 空 · 听写 ${(m.dictBlanks||[]).length}</span>
          <span class="chip">${m.audioKey ? '🎵 音频' : m.audioURL ? '🔗 链接' : '🗣️ TTS'}</span>
          ${prog>0 ? `<span class="chip">进度 ${prog}%</span>` : ''}
        </div>
      </div>
      <div style="color:var(--faint);font-size:18px">›</div>`;
    const del = document.createElement('button');
    del.className='del'; del.textContent='✕'; del.title='删除';
    del.onclick = async e => { e.stopPropagation();
      if(confirm('删除材料「'+m.name+'」？')){ if(m.audioKey) await idbDel(m.audioKey); materials.splice(i,1); persist(); renderList(); } };
    d.appendChild(del);
    d.onclick = ()=> startPractice(i);
    el.appendChild(d);
  });
  fitMatListHeight();
}
function fitMatListHeight(){
  // 列表高度 = min(3, 卡数) × 卡高 + 间隙；无卡片时不限制
  const list = document.getElementById('matList');
  if(!list) return;
  const cards = list.querySelectorAll('.mat');
  const h = cards[0] ? cards[0].offsetHeight : 0;
  if(h > 0){
    const n = Math.min(3, cards.length);
    list.style.maxHeight = (h * n + (n-1)*10) + 'px';
  } else {
    list.style.maxHeight = '';
  }
}
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(materials));
  }catch(e){
    showErr('本地存储空间不足，最新进度可能未保存：' + e.message);
  }
}

/* ---------- 词性分析（compromise.js）：只挖形容词 + 谓语动词 ---------- */
let _nlpPromise = null;
function loadNlp(){
  if(!_nlpPromise){
    _nlpPromise = import('https://cdn.jsdelivr.net/npm/compromise@14.14.2/builds/compromise.min.mjs')
      .then(m => m.nlp || m.default || m)
      .catch(e => { _nlpPromise = null; throw e; });
  }
  return _nlpPromise;
}
async function ensurePOS(text){
  try{
    const nlp = await loadNlp();
    const doc = nlp(text);
    const verbs = new Set(), adjs = new Set();
    const addAll = (set, arr) => arr.forEach(ph=>{
      String(ph).toLowerCase().split(/\s+/).forEach(w=>{
        w = w.replace(/[^a-z0-9']/g,'');
        // 短功能词单独出现时不计入（避免全局误挖 the/to 等）
        if(w && !/^(the|a|an|to|that|there|i|we|he|she|it|they|you)$/.test(w)) set.add(w);
      });
    });
    addAll(verbs, doc.verbs().out('array'));
    addAll(adjs, doc.adjectives().out('array'));
    // 逐词 tags 兜底：短语提取可能漏（如被动式 "get extended"、第三人称 "recruits"、-ful 形容词）
    doc.json().forEach(term=>{
      const w = String(term.text||'').toLowerCase().replace(/[^a-z0-9']/g,'');
      if(!w) return;
      const tags = term.tags || [];
      if(tags.includes('Verb') || tags.includes('PastTense') || tags.includes('Gerund')) verbs.add(w);
      if(tags.includes('Adjective')) adjs.add(w);
    });
    return { verbs, adjs };
  }catch(e){
    return null; // CDN 失败 → 调用方回退启发式
  }
}

/* ---------- 分词 + 挖空 ---------- */
function tokenize(text, mode, pos){
  const toks = [];
  const raw = text.replace(/\s+/g,' ').trim();
  if(mode === 'manual'){
    raw.split(/(\[[^\]]+\])/).forEach(part=>{
      const m = part.match(/^\[([^\]]+)\]$/);
      if(m){ const phrase = m[1].trim().replace(/\s+/g,' '); toks.push({w:phrase, ans:phrase}); }
      else part.split(/\s+/).filter(Boolean).forEach(w=> toks.push({w, ans:null}));
    });
    return toks;
  }
  if(mode === 'dictation'){
    // 全篇听写：每个单词一个空（标点不算）
    raw.split(/(\s+|[,.!?;:]+)/).filter(Boolean).forEach(w=>{
      if(/^\s+$/.test(w)) return;
      if(/^[,.!?;:]+$/.test(w)){ toks.push({w, ans:null, punc:true}); return; }
      const core = w.replace(/[^A-Za-z0-9']/g,'');
      if(!core){ toks.push({w, ans:null}); return; }
      toks.push({w, ans:w});
    });
    // 每句保留首尾原词（首词 + 句末词可见），中间全部挖空 —— 便于定位句子
    let wordIdxs = [];
    const endSent = () => {
      if(wordIdxs.length >= 3){
        toks[wordIdxs[0]].ans = null;                       // 首词保留
        toks[wordIdxs[wordIdxs.length-1]].ans = null;       // 末词保留
      }
      wordIdxs = [];
    };
    toks.forEach((t,i)=>{
      if(t.ans) wordIdxs.push(i);
      if(t.punc && /^[.!?]$/.test(t.w)) endSent();
    });
    endSent();  // 最后一段（无句号结尾）
    return toks;
  }
  raw.split(/(\s+|[,.!?;:]+)/).filter(Boolean).forEach(w=>{
    if(/^\s+$/.test(w)) return;
    if(/^[,.!?;:]+$/.test(w)){ toks.push({w, ans:null, punc:true}); return; }
    const core = w.replace(/[^A-Za-z0-9']/g,'');
    let hit = false;
    if(mode === 'all-num'){
      hit = /\d/.test(core);
    } else if(pos && (pos.verbs.size || pos.adjs.size)){
      // 词性标注：只挖形容词和谓语动词（含过去式/动名词），人名、数字、名词一律不挖
      const low = core.toLowerCase();
      hit = pos.verbs.has(low) || pos.adjs.has(low);
    } else {
      // 兜底启发式（CDN 不可用时）：较长的实义词，排除数字/大写专名/缩写/基础词
      const skip = new Set(('the,a,an,and,or,but,of,to,in,on,at,for,with,is,are,was,were,be,been,being,am,'+
        'that,this,these,those,it,its,i,you,we,they,them,he,she,his,her,their,our,me,us,him,'+
        'as,by,so,if,not,no,yes,do,does,did,done,doing,have,has,had,will,would,shall,should,can,could,may,might,must,'+
        'my,your,from,about,there,here,when,what,where,how,why,who,than,then,into,onto,over,under,up,down,out,off,'+
        'just,also,some,any,all,both,each,every,other,another,such,very,quite,rather,too,more,most,less,least,'+
        'because,before,after,again,always,never,often,sometimes,usually,really,even,still,only,now,new,well,'+
        'one,two,three,first,second,next,last,okay,hello,please,thanks,thank,sorry,right,oh,um,uh,yeah,yep,hi,good').split(','));
      const isContraction = /^(do|does|did|have|has|had|is|are|was|were|am|will|would|shall|should|can|could|must|let|that|there|what|who|it|i|we|they|you|he|she)['’](s|t|re|ve|ll|d|m)$/i;
      hit = !isContraction.test(core) && !/\d/.test(core) && !/^[A-Z]/.test(core)
            && core.length >= 7 && !skip.has(core.toLowerCase());
    }
    toks.push({w, ans: hit ? w : null});
  });
  return toks;
}
function norm(x){ return String(x).trim().toLowerCase().replace(/[^a-z0-9']/g,''); }

function buildBlanks(text, mode, pos){
  const tokens = tokenize(text, mode, pos);
  let candIdx = tokens.map((t,i)=> t.ans ? i : -1).filter(i=>i>=0);
  // 全篇听写/手动模式：不做 35~40 上限
  if(mode === 'auto' && candIdx.length > 38){
    // 重要性评分贪心：越长约重要、数字/专名加权、谓语动词优先；最小间距防扎堆
    const score = i => {
      const core = tokens[i].w.replace(/[^A-Za-z0-9']/g,'');
      let s = Math.min(core.length, 14) * 1.2;
      if(/\d/.test(core)) s += 12;
      if(/^[A-Z]/.test(core)) s += 6;
      if(/^[A-Z]+$/.test(core) && core.length >= 2) s += 4;
      if(pos && pos.verbs.has(core.toLowerCase())) s += 3; // 谓语动词是句子核心，优先保留
      return s;
    };
    const sorted = [...candIdx].sort((a,b)=> score(b)-score(a));
    const picked = [];
    const okGap = (i, gap) => picked.every(pi => Math.abs(pi-i) > gap);
    for(const i of sorted){
      if(picked.length >= 38) break;
      if(okGap(i, 3)) picked.push(i);
    }
    if(picked.length < 38){
      for(const i of sorted){
        if(picked.length >= 38) break;
        if(!picked.includes(i)) picked.push(i);
      }
    }
    const keep = new Set(picked);
    tokens.forEach((t,i)=>{ if(t.ans && !keep.has(i)) t.ans = null; });
  }
  const blanks = tokens.filter(t=>t.ans).map(t=>({answer:t.ans, user:'', state:''}));
  return { tokens, blanks };
}

async function saveMaterial(){
  const name = document.getElementById('matName').value.trim() || '未命名材料 ' + new Date().toLocaleDateString();
  const text = document.getElementById('transcript').value.trim();
  if(!text){ alert('请先粘贴听力原文'); return; }
  const mode = document.getElementById('blankMode').value;
  let pos = null;
  if(mode === 'auto'){
    asrStatus('🧠 词性分析中（只挑形容词/谓语动词）…');
    pos = await ensurePOS(text);
    if(!pos) asrStatus('⚠️ 词性库加载失败，本次回退长度启发式');
  }
  const { tokens, blanks } = buildBlanks(text, mode, pos);
  if(!blanks.length){ alert('没有找到可挖空的内容，试试手动模式用 [方括号] 标注'); return; }
  // 同时生成全篇听写视图（每词一空），供「盲听」切换
  const dictSet = buildBlanks(text, 'dictation');
  const file = document.getElementById('audioFile').files[0];
  const url = document.getElementById('audioUrl').value.trim();
  let audioKey = null;
  try{
    const uid = Date.now().toString(36) + Math.random().toString(36).slice(2,8);
    if(!url && file){
      if(file.size > 200*1024*1024){ alert('音频过大（>200MB），请裁剪后再导入'); return; }
      audioKey = 'aud_' + uid;
      await idbPut(audioKey, file);
    }
    materials.unshift({ id:'m_'+uid, name, mode, tokens, blanks, dictTokens:dictSet.tokens, dictBlanks:dictSet.blanks, audioKey, audioURL:url||null, created:Date.now() });
    persist(); renderList();
    document.getElementById('matName').value=''; document.getElementById('transcript').value='';
    document.getElementById('audioFile').value=''; document.getElementById('audioUrl').value='';
    asrStatus('');
    alert('已保存！共 '+blanks.length+' 个空');
  }catch(e){
    alert('保存失败：' + e.message);
  }
}

function onEngineChange(){

function asrStatus(t){ document.getElementById('asrStatus').textContent = t; }
function asrProgress(p){
  const wrap = document.getElementById('asrProgWrap'), bar = document.getElementById('asrProg');
  wrap.classList.remove('hidden');
  bar.style.width = Math.max(0, Math.min(100, p)) + '%';

async function getAudioBuffer(){
  const file = document.getElementById('audioFile').files[0];
  const url = document.getElementById('audioUrl').value.trim();
  let arrayBuf;
  if(file) arrayBuf = await file.arrayBuffer();
  else if(url){
    asrStatus('⬇️ 正在下载音频…');
    const resp = await fetch(url);
    if(!resp.ok) throw new Error('音频下载失败 HTTP ' + resp.status + '（可换用本地服务器引擎，由服务器下载）');
    arrayBuf = await resp.arrayBuffer();
  } else throw new Error('请先选择音频文件或粘贴音频链接');
  asrStatus('🎵 正在解码音频…');
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const buf = await ctx.decodeAudioData(arrayBuf);
  ctx.close();
  let ch;
  if(buf.numberOfChannels > 1){
    const l = buf.getChannelData(0), r = buf.getChannelData(1);
    ch = new Float32Array(l.length);
    for(let i=0;i<l.length;i++) ch[i] = (l[i]+r[i])/2;
  } else ch = buf.getChannelData(0);
  return ch;
}
async function getPipeline(){
  const model = document.getElementById('asrModel').value;
  if(getPipeline._pipe && getPipeline._key === model) return getPipeline._pipe;
  const dtype = /large|turbo/.test(model) ? 'q4' : 'q8';
  if(/large|turbo/.test(model)){
    asrStatus('⚠️ 旗舰模型约 800MB，下载较久；识别速度约为音频时长的 1~3 倍，期间请勿关闭页面');
  } else {
    asrStatus('📦 首次使用需下载模型…');
  }
  const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.5');
  env.allowLocalModels = false;
  const useGPU = /large|turbo/.test(model) && navigator.gpu;
  getPipeline._pipe = await pipeline('automatic-speech-recognition', model, {
    dtype,
    device: useGPU ? 'webgpu' : 'wasm',
    progress_callback: info => {
      if(info.status === 'progress' && info.total){
        asrProgress(info.loaded / info.total * 100);
        asrStatus(`📦 模型下载中 ${Math.round(info.loaded/info.total*100)}%`);
      }
    }
  });
  getPipeline._key = model;
  return getPipeline._pipe;
}

/* ---------- 静音点切分 ---------- */
function splitAudioOnSilence(audio){
  const SR = 16000, hop = Math.round(SR*0.05);
  const frames = Math.floor(audio.length/hop);
  if(frames === 0) return [[0, audio.length]];
  const rms = new Float32Array(frames);
  for(let f=0;f<frames;f++){ let s=0; for(let i=f*hop;i<(f+1)*hop;i++){ const v=audio[i]; s+=v*v; } rms[f]=Math.sqrt(s/hop); }
  const sorted = Float32Array.from(rms).sort();
  const noise = sorted[Math.floor(sorted.length*0.2)] || 0.005;
  const thr = Math.max(0.006, noise*4);
  const cuts = [];
  let f = 0;
  while(f < frames){
    if(rms[f] < thr){
      let g = f;
      while(g < frames && rms[g] < thr) g++;
      if((g-f)*hop >= SR*0.35) cuts.push(Math.round((f+g)/2*hop));
      f = g;
    } else f++;
  }
  const target = SR*18, maxSeg = SR*28;
  const segs = [];
  let start = 0;
  const push = (s,e) => { if(e-s > SR*0.5) segs.push([s,e]); };
  for(const c of cuts){
    if(c <= start) continue;
    if(c - start > maxSeg){
      while(c - start > maxSeg){ push(start, start+maxSeg); start += maxSeg; }
    }
    if(c - start >= target){ push(start, c); start = c; }
  }
  while(audio.length - start > maxSeg){ push(start, start+maxSeg); start += maxSeg; }
  push(start, audio.length);
  return segs.length ? segs : [[0, audio.length]];
}

async function autoTranscribe(btn){
  if(autoTranscribe._busy) return;
  autoTranscribe._busy = true;
  btn.disabled = true;
  const old = btn.textContent;
  try{
    let text;
    const engine = document.getElementById('asrEngine').value;
    if(engine === 'local'){
      const base = document.getElementById('qwenServer').value.trim().replace(/\/$/,'');
      const file = document.getElementById('audioFile').files[0];
      const url = document.getElementById('audioUrl').value.trim();
      let resp;
      if(url && !file){
        asrStatus('📤 让服务器下载音频并识别…');
        resp = await fetch(base + '/transcribe', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ url })
        });
      } else if(file){
        asrStatus('📤 音频已发送到本地服务器（Qwen3-ASR 识别中，约需 1~2 分钟）…');
        resp = await fetch(base + '/transcribe', { method:'POST', body: file });
      } else throw new Error('请先选择音频文件或粘贴音频链接');
      let data;
      try{ data = await resp.json(); }
      catch(_){ throw new Error('无法连接本地识别服务器——请先双击「启动本地识别服务.command」，等窗口出现 server listening'); }
      if(!resp.ok || data.error) throw new Error(data.error || ('HTTP ' + resp.status));
      text = (data.text || '').trim();
      asrStatus(`✅ 服务器识别完成（${data.segments} 段，耗时 ${data.seconds}s）！`);
      asrProgress(100);
    } else {
      const audio = await getAudioBuffer();
      const secs = Math.round(audio.length/16000);
      asrStatus(`🧠 识别中…（${Math.floor(secs/60)}分${secs%60}秒的音频，请耐心等待）`);
      const transcriber = await getPipeline();
      const segs = splitAudioOnSilence(audio);
      asrStatus(`🧠 已按停顿切分为 ${segs.length} 段，逐段识别中…`);
      let full = '';
      for(let k=0;k<segs.length;k++){
        asrStatus(`🧠 逐段识别中 第 ${k+1} / ${segs.length} 段…`);
        const seg = audio.subarray(segs[k][0], segs[k][1]);
        const out = await transcriber(seg);
        full += (out.text || '').trim() + ' ';
        asrProgress((k+1)/segs.length*100);
      }
      text = full.replace(/\s+/g,' ').trim();
    }
    if(!text) throw new Error('没有识别到语音内容');
    const sents = text.split(/(?<=[.?!])\s+/);
    const lines = []; let line = '';
    sents.forEach(s=>{
      if((line+' '+s).length > 90){ if(line) lines.push(line); line = s; }
      else line = line ? line+' '+s : s;
    });
    if(line) lines.push(line);
    document.getElementById('transcript').value = lines.join('\n');
    asrStatus('✅ 识别完成！已填入原文，选择挖空模式后点「保存材料」');
    asrProgress(100);
  } catch(e){
    asrStatus('❌ ' + e.message);
    asrProgress(0);
  } finally {
    autoTranscribe._busy = false;
    btn.disabled = false;
    btn.textContent = old;
  }
}

function renderText(){
  const box = document.getElementById('textBox');
  const blind = current.view === 'dict';   // 盲听视图 = 全篇听写
  const dict = blind;
  box.classList.toggle('dictation', dict);
  box.innerHTML = '';
  let bi = 0;
  let lastText = null;
  let sentIdx = 0;
  let sentBlankTotal = 0;
  current.sentChipEls = [];
  const showCn = localStorage.getItem('ielts_show_cn') === '1';
  const addText = s => { const n = document.createTextNode(s); box.appendChild(n); lastText = n; return n; };
  const afterSentence = () => {
    if(dict){
      const chip = document.createElement('span');
      chip.className = 'sent-chip';
      chip.dataset.sent = String(sentIdx);
      chip.textContent = '0/' + sentBlankTotal;
      box.appendChild(chip);
      current.sentChipEls[sentIdx] = chip;
    }
    if(showCn && current.sentTrans && current.sentTrans[sentIdx]){
      const cn = document.createElement('div');
      cn.className = 'cn';
      cn.textContent = '🇨🇳 ' + current.sentTrans[sentIdx];
      box.appendChild(cn);
    }
    box.appendChild(document.createElement('br'));
    sentIdx++;
    sentBlankTotal = 0;
    lastText = null;
  };
  current.tokens.forEach(t=>{
    if(t.ans){
      const b = current.blanks[bi++];
      const span = document.createElement('span');
      span.className = 'blank' + (b.state==='ok'?' ok':b.state==='bad'?' bad':'');
      span.title = '被挖空的词';
      const inp = document.createElement('input');
      inp.value = b.user; inp.autocomplete='off'; inp.spellcheck=false;
      inp.placeholder = b.answer.replace(/[A-Za-z0-9]/g, '_');
      inp.dataset.sent = String(sentIdx);
      inp.addEventListener('focus', ()=> span.classList.add('current'));
      inp.addEventListener('blur', ()=> span.classList.remove('current'));
      inp.addEventListener('input', ()=>{ updateStats(); autoSaveProgress(); });
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); checkAll(); } });
      span.appendChild(inp);
      if(b.state){
        const a = document.createElement('span'); a.className='ans'; a.textContent = b.answer; span.appendChild(a);
      }
      box.appendChild(span);
      if(dict) sentBlankTotal++;
    } else if(t.punc && /^[.!?]$/.test(t.w)){
      if(blind){
        afterSentence();
        return;
      }
      if(lastText) lastText.textContent = lastText.textContent.replace(/ +$/,'');
      addText(t.w);
      box.appendChild(document.createElement('br'));
      afterSentence();
    } else if(t.punc){
      if(!blind){
        if(lastText) lastText.textContent = lastText.textContent.replace(/ +$/,'');
        addText(t.w + ' ');
      }
    } else {
      if(!blind) addText(t.w + ' ');
    }
  });
  updateStats();
}
function updateStats(){
  let ok=0, bad=0, filled=0;
  const inputs = document.querySelectorAll('#textBox .blank input');
  const perSent = {};
  current.blanks.forEach((b,i)=>{
    if(b.state==='ok') ok++;
    if(b.state==='bad') bad++;
    if(inputs[i] && inputs[i].value.trim()) filled++;
  });
  inputs.forEach(inp=>{
    const si = inp.dataset ? +(inp.dataset.sent || NaN) : NaN;
    if(isNaN(si)) return;
    perSent[si] = perSent[si] || {f:0,t:0};
    perSent[si].t++;
    if(inp.value.trim()) perSent[si].f++;
  });
  (current.sentChipEls||[]).forEach((chip,si)=>{
    if(chip && perSent[si]) chip.textContent = perSent[si].f + '/' + perSent[si].t;
  });
  document.getElementById('correct').textContent = ok;
  document.getElementById('wrong').textContent = bad;
  document.getElementById('filled').textContent = filled + '/' + current.blanks.length;
}

/* ---------- 播放与键盘控制 ---------- */
function togglePlay(){
  const p = player();
  if(!p || !p.src) return;
  if(p.paused) p.play().catch(()=>{}); else p.pause();
}
function nudge(d){
  const p = player();
  if(!p || !p.src) return;
  const max = isFinite(p.duration) ? p.duration : 1e9;
  p.currentTime = Math.max(0, Math.min(max - 0.1, p.currentTime + d));
}
function setRate(r){ const p = player(); if(p) p.playbackRate = parseFloat(r)||1; }
document.addEventListener('DOMContentLoaded', ()=>{
  onEngineChange();
  initSeekBar();
  const p = player();
  p.addEventListener('play', ()=>{ document.getElementById('playBtn').textContent = '⏸️ 暂停'; });
  p.addEventListener('pause', ()=>{ document.getElementById('playBtn').textContent = '▶️ 播放'; });
  p.addEventListener('loadedmetadata', ()=>{
    if(isFinite(p.duration)) document.getElementById('durTime').textContent = fmtTime(p.duration);
  });
});
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0');
}
let seeking = false;
function initSeekBar(){
  const bar = document.getElementById('seekBar'), p = player();
  bar.addEventListener('input', ()=>{
    const d = p.duration;
    if(!isFinite(d)) return;
    seeking = true;
    const t = (bar.value/1000) * d;
    p.currentTime = t;
    document.getElementById('curTime').textContent = fmtTime(t);
  });
  bar.addEventListener('change', ()=>{ seeking = false; });
  bar.addEventListener('pointerdown', ()=>{ seeking = true; });
  window.addEventListener('pointerup', ()=>{ setTimeout(()=>{ seeking = false; }, 50); });
  p.addEventListener('timeupdate', ()=>{
    if(seeking) return;
    const d = p.duration;
    if(!isFinite(d) || !d) return;
    bar.value = Math.round(p.currentTime / d * 1000);
    document.getElementById('curTime').textContent = fmtTime(p.currentTime);
    if(abLoop.b != null && p.currentTime >= abLoop.b){
      p.currentTime = abLoop.a ?? 0;
    }
  });
}

/* ---------- AB 循环 ---------- */
const abLoop = { a:null, b:null };
function cycleAB(){
  const p = player();
  if(!p || !p.src) return;
  const btn = document.getElementById('abBtn');
  if(abLoop.a == null){
    abLoop.a = p.currentTime;
    btn.textContent = '🅰 ' + fmtTime(abLoop.a) + ' → 点设B';
    btn.classList.add('ab-on');
  } else if(abLoop.b == null){
    let a = abLoop.a, b = p.currentTime;
    if(b - a < 1){ b = a + 5; }
    if(b < a){ [a,b] = [b,a]; }
    abLoop.a = a; abLoop.b = b;
    if(p.currentTime < a || p.currentTime > b) p.currentTime = a;
    p.play().catch(()=>{});
    btn.textContent = '⟳ 循环 ' + fmtTime(a) + ' ~ ' + fmtTime(b) + '（点击取消）';
  } else {
    abLoop.a = null; abLoop.b = null;
    btn.textContent = '🔁 AB循环';
    btn.classList.remove('ab-on');
  }
}

/* ---------- TTS ---------- */
let ttsVoice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
  ttsVoice = vs.find(v=>/GB|UK/i.test(v.lang+v.name)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function fullPlainText(){
  return current.tokens.map(t=>t.w).join(' ').replace(/\s+([,.!?;:])/g,'$1');
}
function speakAll(rate){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(fullPlainText());
  if(ttsVoice) u.voice = ttsVoice;
  u.lang='en-GB'; u.rate = rate || 1;
  speechSynthesis.speak(u);
}

/* ---------- 盲听 = 全篇听写视图切换 ---------- */
function setActiveView(v){
  if(!current) return;
  current.view = v;
  current.tokens = current.sets[v].tokens;
  current.blanks = current.sets[v].blanks;
}
function toggleBlind(){
  if(!current) return;
  autoSaveProgress();
  const to = current.view === 'dict' ? 'normal' : 'dict';
  setActiveView(to);
  const bb = document.getElementById('blindBtn');
  bb.textContent = to==='dict' ? '🙈 盲听 · 全篇听写（开）' : '🙈 盲听 · 全篇听写';
  bb.classList.toggle('on', to==='dict');
  document.getElementById('result').style.display='none';
  renderText();
}

/* ---------- 进度自动保存 ---------- */
let saveTimer = null;
function flushInputsToActive(){
  // DOM 输入框 → 内存活动层
  if(!current) return;
  const inputs = document.querySelectorAll('#textBox .blank input');
  current.blanks.forEach((b,i)=>{ if(inputs[i]) b.user = inputs[i].value; });
}
function autoSaveProgress(immediate){
  clearTimeout(saveTimer);
  const run = ()=>{
    if(curMatIndex < 0 || !materials[curMatIndex] || materials[curMatIndex].id !== current.id) return;
    flushInputsToActive();
    const target = current.view==='dict' ? materials[curMatIndex].dictBlanks : materials[curMatIndex].blanks;
    target.forEach((b,i)=>{ if(current.blanks[i]) b.user = current.blanks[i].user; });
    persist();
  };
  if(immediate) run(); else saveTimer = setTimeout(run, 800);
}
function syncStatesToMaterial(){
  if(curMatIndex < 0 || !materials[curMatIndex] || materials[curMatIndex].id !== current.id) return;
  const set = current.sets[current.view];
  if(current.view==='dict') materials[curMatIndex].dictBlanks = JSON.parse(JSON.stringify(set.blanks));
  else materials[curMatIndex].blanks = JSON.parse(JSON.stringify(set.blanks));
  persist();
}

/* ---------- 批改（就地更新） ---------- */
function applyBlankState(i){
  const spans = document.querySelectorAll('#textBox .blank');
  const span = spans[i];
  if(!span) return;
  const b = current.blanks[i];
  span.classList.remove('ok','bad');
  if(b.state) span.classList.add(b.state);
  let ans = span.querySelector('.ans');
  if(b.state){
    if(!ans){ ans = document.createElement('span'); ans.className='ans'; span.appendChild(ans); }
    ans.textContent = b.answer;
  } else if(ans){ ans.remove(); }
}
function checkAll(){
  const spans = document.querySelectorAll('#textBox .blank');
  let ok=0, bad=0;
  current.blanks.forEach((b,i)=>{
    const inp = spans[i] ? spans[i].querySelector('input') : null;
    if(inp) b.user = inp.value;
    b.state = norm(b.user) === norm(b.answer) ? 'ok' : 'bad';
    if(b.state==='ok') ok++; else bad++;
    applyBlankState(i);
  });
  updateStats(); syncStatesToMaterial();
  const res = document.getElementById('result');
  res.style.display='block';
  if(bad === 0){
    res.className='result good';
    res.innerHTML = `🎉 全部正确（${ok}/${ok}）！这篇拿下，换下一篇吧。`;
  } else {
    res.className='result meh';
    res.innerHTML = `📝 正确率 <b>${Math.round(ok/(ok+bad)*100)}%</b>（${ok}/${ok+bad}）· 红色处即错词 → 🔁 只重做错题，或重听音频`;
  }
}
function revealAll(){
  const spans = document.querySelectorAll('#textBox .blank');
  current.blanks.forEach((b,i)=>{
    const inp = spans[i] ? spans[i].querySelector('input') : null;
    if(inp && !inp.value.trim()) inp.value = b.answer;
    b.user = inp ? inp.value : b.user;
    b.state = norm(b.user) === norm(b.answer) ? 'ok' : 'bad';
    applyBlankState(i);
  });
  updateStats(); syncStatesToMaterial();
  const res = document.getElementById('result');
  res.style.display='block'; res.className='result meh';
  res.innerHTML = '👀 已显示全部答案（空着的已自动填入）。';
}
function retryWrong(){
  let any = false;
  const spans = document.querySelectorAll('#textBox .blank');
  current.blanks.forEach((b,i)=>{
    if(b.state === 'bad'){
      any = true;
      b.user=''; b.state='';
      const inp = spans[i] ? spans[i].querySelector('input') : null;
      if(inp) inp.value = '';
      applyBlankState(i);
    }
  });
  if(!any){ alert('没有错题！'); return; }
  document.getElementById('result').style.display='none';
  updateStats(); syncStatesToMaterial();
  const firstEmpty = document.querySelector('#textBox .blank:not(.ok):not(.bad) input');
  if(firstEmpty) firstEmpty.focus();
}
function resetAll(){
  current.blanks.forEach(b=>{ b.user=''; b.state=''; });
  const p = player(); if(p && p.src) p.currentTime = 0;
  speechSynthesis.cancel();
  document.getElementById('result').style.display='none';
  renderText(); syncStatesToMaterial();
}
function goHome(){
  speechSynthesis.cancel();
  player().pause();
  autoSaveProgress();
  document.getElementById('practice').classList.add('hidden');
  document.getElementById('home').classList.remove('hidden');
  renderList();
}

/* ---------- 全局键盘控制：空格=播放/暂停，←→=∓5s，↑↓=挖空跳转 ---------- */
document.addEventListener('keydown', e=>{
  if(!current || document.getElementById('practice').classList.contains('hidden')) return;
  if(e.key === ' '){
    e.preventDefault();   // 防止页面滚动/输入空格
    togglePlay();
  } else if(e.key === 'ArrowLeft'){
    e.preventDefault();
    nudge(-5);
  } else if(e.key === 'ArrowRight'){
    e.preventDefault();
    nudge(5);
  } else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    // 在挖空之间跳焦点（循环）
    const inputs = [...document.querySelectorAll('#textBox .blank input')];
    if(!inputs.length) return;
    const idx = inputs.indexOf(document.activeElement);
    e.preventDefault();
    if(idx === -1) inputs[0].focus();
    else if(e.key === 'ArrowDown') inputs[(idx+1) % inputs.length].focus();
    else inputs[(idx-1+inputs.length) % inputs.length].focus();
  }
});

/* ---------- 逐句对照翻译 ---------- */
async function gtxTranslate(text){
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + encodeURIComponent(text);
  const r = await Promise.race([
    fetch(url),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('gtx timeout')), 6000))
  ]);
  if(!r.ok) throw new Error('gtx HTTP ' + r.status);
  const d = await r.json();
  const t = (d[0]||[]).map(x=>x[0]).join('');
  if(!t) throw new Error('gtx empty');
  return t;
}
async function myMemTranslate(text){
  const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=en|zh-CN');
  const d = await r.json();
  const t = d && d.responseData && d.responseData.translatedText;
  if(!t) throw new Error('mymemory empty');
  return t;
}
async function translateSentence(text){
  try{ return await gtxTranslate(text); }
  catch(_){ return await myMemTranslate(text); }
}
function getSentenceTexts(){
  const sents = [];
  let cur = [];
  current.tokens.forEach(t=>{
    cur.push(t.w);
    if(t.punc && /^[.!?]$/.test(t.w)){ sents.push(cur.join(' ').replace(/\s+([,.!?;:])/g,'$1').trim()); cur = []; }
  });
  if(cur.length) sents.push(cur.join(' ').replace(/\s+([,.!?;:])/g,'$1').trim());
  return sents.filter(s=>/[A-Za-z0-9]/.test(s));
}
async function toggleSentTrans(btn){
  const on = localStorage.getItem('ielts_show_cn') === '1';
  if(on){
    localStorage.setItem('ielts_show_cn','0');
    renderText();
    btn.textContent = '🇨🇳 逐句对照';
    return;
  }
  localStorage.setItem('ielts_show_cn','1');
  if(!current.sentTrans) current.sentTrans = [];
  const sents = getSentenceTexts();
  const todo = [];
  sents.forEach((s,i)=>{ if(!current.sentTrans[i]) todo.push(i); });
  if(todo.length){
    let ok = 0, failed = 0;
    for(let k=0;k<todo.length;k++){
      const i = todo[k];
      btn.textContent = `🌐 逐句翻译中 ${k+1}/${todo.length}…`;
      try{
        current.sentTrans[i] = await translateSentence(sents[i]);
        ok++;
      }catch(_){ failed++; }
    }
    if(curMatIndex >= 0 && materials[curMatIndex] && materials[curMatIndex].id === current.id){
      materials[curMatIndex].sentTrans = current.sentTrans.slice();
      persist();
    }
    if(ok === 0){
      btn.textContent = '🇨🇳 逐句对照';
      showErr('逐句翻译失败（需要联网，或翻译接口限额已用完）');
      renderText();
      return;
    }
    if(failed) showErr(failed + ' 句翻译失败已跳过，可再次点击重试');
  }
  btn.textContent = '🇨🇳 逐句对照（开）';
  renderText();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  });
});

renderList();
